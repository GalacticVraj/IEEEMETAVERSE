<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="GridGuard — an immersive smart-grid crisis simulator. Stand over a living city and hold the grid together."
    />
    <title>GridGuard — Meridian Bay Grid Operations</title>
  </head>
  <body style="background: #eef0ef">
    <style>
      /* Static splash — replaced the moment React mounts. */
      #gg-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #eef0ef;
        color: #1c2530;
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      #gg-splash .gg-icon {
        font-size: 32px;
        animation: gg-pulse 2s ease-in-out infinite;
      }
      #gg-splash .gg-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      #gg-splash .gg-sub {
        font-size: 11px;
        color: #5a6774;
        letter-spacing: 0.06em;
      }
      #gg-splash .gg-bar {
        width: 200px;
        height: 3px;
        background: #d3d7d2;
        overflow: hidden;
        border-radius: 2px;
      }
      #gg-splash .gg-bar::after {
        content: '';
        display: block;
        width: 80px;
        height: 3px;
        background: linear-gradient(90deg, #22637e, #38bdf8);
        animation: gg-load 1.1s ease-in-out infinite;
        border-radius: 2px;
      }
      #gg-splash .gg-hint {
        font-size: 10px;
        color: #8b97a3;
        letter-spacing: 0.04em;
        margin-top: 8px;
      }
      @keyframes gg-load {
        0% {
          margin-left: -80px;
        }
        100% {
          margin-left: 200px;
        }
      }
      @keyframes gg-pulse {
        0%,
        100% {
          opacity: 0.6;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #gg-splash .gg-bar::after {
          animation: none;
        }
        #gg-splash .gg-icon {
          animation: none;
        }
      }
    </style>
    <div id="root">
      <div id="gg-splash">
        <div class="gg-icon">⚡</div>
        <div class="gg-title">GRIDGUARD</div>
        <div class="gg-sub">INITIALIZING MERIDIAN BAY DIGITAL TWIN</div>
        <div class="gg-bar"></div>
        <div class="gg-hint">Preparing 3D simulation environment…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
